<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Contribution</title><style>body{font-family:system-ui,sans-serif;background:#f1f5f1;color:#192b2a;max-width:680px;margin:70px auto;padding:24px}main{background:white;border:1px solid #dce5dd;border-radius:18px;padding:32px}button{background:#21684f;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}a{color:#21684f}p{overflow-wrap:anywhere}</style></head>
<body><main><h1>Team Contribution</h1><p>This project grows through collaboration.</p><button id="load-contributor" type="button">Show Contributor</button><p id="contributor-student-id" role="status" aria-live="polite"></p><a href="index.html">Back to Task Manager</a></main>
<script>
'use strict';
document.getElementById('load-contributor').addEventListener('click', async function () {
  const output = document.getElementById('contributor-student-id');
  this.disabled = true; output.textContent = 'Loading…';
  try {
    const response = await fetch('contribution.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (typeof data.contributorStudentId !== 'string' || !/^\d+$/.test(data.contributorStudentId)) throw new Error('Invalid contributor information.');
    output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
  } catch (error) { output.textContent = `Unable to load contributor: ${error.message}`; }
  finally { this.disabled = false; }
});
</script></body></html>
